name: CodeDeploy Backend Manual Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  APP_CONTAINER_NAME: paylens-backend
  APP_PORT: "8080"

jobs:
  codedeploy-manual-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      CODEDEPLOY_APPLICATION_NAME: ${{ vars.CODEDEPLOY_APPLICATION_NAME }}
      CODEDEPLOY_DEPLOYMENT_GROUP_NAME: ${{ vars.CODEDEPLOY_DEPLOYMENT_GROUP_NAME }}
      CODEDEPLOY_BUNDLE_BUCKET: ${{ vars.CODEDEPLOY_BUNDLE_BUCKET }}
      CODEDEPLOY_BUNDLE_PREFIX: ${{ vars.CODEDEPLOY_BUNDLE_PREFIX || 'paylens-backend/codedeploy' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required GitHub variables
        run: |
          missing=0
          for key in AWS_REGION AWS_ROLE_ARN ECR_REPOSITORY CODEDEPLOY_APPLICATION_NAME CODEDEPLOY_DEPLOYMENT_GROUP_NAME CODEDEPLOY_BUNDLE_BUCKET; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing GitHub variable: $key"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build-image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}"

          docker build -t "${IMAGE_URI}:${IMAGE_TAG}" -t "${IMAGE_URI}:latest" .
          docker push "${IMAGE_URI}:${IMAGE_TAG}"
          docker push "${IMAGE_URI}:latest"

          echo "image_ref=${IMAGE_URI}:${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Create CodeDeploy bundle
        env:
          IMAGE_REF: ${{ steps.build-image.outputs.image_ref }}
        run: |
          echo "${IMAGE_REF}" > image-uri.txt
          zip -r codedeploy-bundle.zip \
            appspec.yml \
            deploy/codedeploy \
            deploy/ec2/deploy-from-ecr.sh \
            image-uri.txt

      - name: Upload bundle to S3
        id: upload-bundle
        run: |
          BUNDLE_KEY="${CODEDEPLOY_BUNDLE_PREFIX}/${GITHUB_SHA}.zip"
          aws s3 cp codedeploy-bundle.zip "s3://${CODEDEPLOY_BUNDLE_BUCKET}/${BUNDLE_KEY}"
          echo "bundle_key=${BUNDLE_KEY}" >> "${GITHUB_OUTPUT}"

      - name: Create CodeDeploy deployment
        id: create-deployment
        run: |
          DEPLOYMENT_ID="$(aws deploy create-deployment \
            --application-name "${CODEDEPLOY_APPLICATION_NAME}" \
            --deployment-group-name "${CODEDEPLOY_DEPLOYMENT_GROUP_NAME}" \
            --s3-location bucket="${CODEDEPLOY_BUNDLE_BUCKET}",key="${{ steps.upload-bundle.outputs.bundle_key }}",bundleType=zip \
            --description "PayLens backend CodeDeploy manual deploy ${GITHUB_SHA}" \
            --query 'deploymentId' \
            --output text)"

          echo "deployment_id=${DEPLOYMENT_ID}" >> "${GITHUB_OUTPUT}"

      - name: Wait for deployment
        run: |
          aws deploy wait deployment-successful \
            --deployment-id "${{ steps.create-deployment.outputs.deployment_id }}"
